<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radios App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <main class="app-container">
    <div class="app-card" id="radioFrame">

      <div class="app-header">
        <div class="app-header-left">
          <i class="fas fa-tower-broadcast"></i>
          <span>Radios</span>
        </div>
        <div class="app-header-actions">
          <button class="btn-header" id="btnHardRefresh" title="Actualizar"><i class="fas fa-rotate"></i></button>
        </div>
      </div>

      <div class="player-section">
        <div class="player-display">
          <div class="visualizer-wrap">
            <canvas id="equalizer" class="equalizer-canvas"></canvas>
          </div>
          <div class="player-info">
            <div class="player-time" id="radioDisplayTime">00:00</div>
            <div class="player-stats">
              <span id="plCount">0 radios</span>
              <span>44 kHz</span>
            </div>
          </div>
        </div>

        <div class="now-playing" id="radioDisplay">Radios App — Listo para sintonizar...</div>

        <div class="search-bar">
          <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Buscar emisoras..." autocomplete="off">
            <div id="searchHistory" class="search-history-dropdown hidden"></div>
          </div>
          <select id="filterBitrate" class="filter-select" title="Bitrate">
            <option value="0">Qual</option>
            <option value="128">128k</option>
            <option value="192">192k</option>
          </select>
          <select id="filterCodec" class="filter-select" title="Codec">
            <option value="">Codec</option>
            <option value="MP3">MP3</option>
            <option value="AAC">AAC</option>
          </select>
          <button id="btnDeepSearch" class="btn-deep" title="Búsqueda profunda"><i class="fas fa-globe"></i></button>
        </div>
      </div>

      <div class="controls-section">
        <div class="transport-buttons">
          <button class="btn-transport" id="btnPrev"><i class="fas fa-backward-step"></i></button>
          <button class="btn-transport play-main" id="btnPlayWinamp"><i class="fas fa-play"></i></button>
          <button class="btn-transport" id="btnPause"><i class="fas fa-pause"></i></button>
          <button class="btn-transport" id="btnStop"><i class="fas fa-stop"></i></button>
          <button class="btn-transport" id="btnNext"><i class="fas fa-forward-step"></i></button>
        </div>

        <div class="tab-bar">
          <button class="tab-btn active" id="tabResults">RESULTADOS</button>
          <button class="tab-btn" id="tabPlaylist">PLAYLIST</button>
        </div>
      </div>

      <div class="content-area">
        <div id="resultsSection" class="content-scroll">
          <div id="results" class="results-list"></div>
        </div>
        <div id="playlistSection" class="content-scroll hidden">
          <div id="playlist" class="playlist-list"></div>
        </div>
      </div>

      <div class="app-footer">
        <div class="app-footer-btns">
          <button class="btn-footer" id="btnExportJSON" title="Guardar JSON">SAVE</button>
          <button class="btn-footer" id="btnImportJSON" title="Cargar JSON">LOAD</button>
        </div>
        <div class="resize-handle">//</div>
      </div>

      <div class="radio-player hidden">
        <audio id="audioPlayer" playsinline></audio>
      </div>
    </div>
  </main>

  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script src="app.js"></script>

</body>
</html>
