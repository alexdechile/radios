<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radios Mini — DonAlex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="mini.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div class="mini-app">
    <!-- Header -->
    <header class="mini-header">
      <div class="header-title">
        <i class="fas fa-tower-broadcast"></i>
        <span>Radios</span>
      </div>
      <div class="header-actions">
        <button class="btn-header-mini" id="btnMiniExportJSON"><i class="fas fa-download"></i></button>
        <button class="btn-header-mini" id="btnMiniImportJSON"><i class="fas fa-upload"></i></button>
        <button class="btn-header-mini" id="btnMiniEffectsToggle" title="Efectos de Audio"><i class="fas fa-wand-magic-sparkles"></i></button>
        <button class="btn-classic-mode" id="btnClassicMode" title="Versión Clásica">
          <i class="fas fa-desktop"></i>
        </button>
      </div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <div class="search-container">
        <div class="search-row">
          <input type="text" id="miniSearchInput" placeholder="Buscar emisoras..." autocomplete="off">
          <button class="mini-search-clear" id="miniSearchClear" title="Limpiar"><i class="fas fa-times"></i></button>
          <button id="btnMiniSearch" class="btn-search" title="Buscar"><i class="fas fa-magnifying-glass"></i></button>
        </div>
        <div class="filter-row">
          <select id="miniFilterCodec" class="mini-filter">
            <option value="">Cualquier Codec</option>
            <option value="MP3">MP3</option>
            <option value="AAC">AAC</option>
          </select>
          <select id="miniFilterBitrate" class="mini-filter">
            <option value="0">Cualquier Bitrate</option>
            <option value="128">128kbps +</option>
            <option value="192">192kbps +</option>
          </select>
          <button id="btnMiniDeepSearch" class="btn-deep-search" title="Búsqueda profunda local + web">
            <i class="fas fa-globe"></i> Deep
          </button>
        </div>
      </div>
    </section>

    <!-- Effects Panel -->
    <div id="miniEffectsPanel" class="mini-effects-panel hidden">
      <div class="mini-effects-header">
        <i class="fas fa-wand-magic-sparkles"></i> Efectos
        <button class="btn-mini-effects-reset" id="btnMiniEffectsReset">Normal</button>
      </div>
      <div class="mini-effects-body">
        <div class="mini-effect-row">
          <span class="mini-effect-label"><i class="fas fa-arrows-left-right"></i> Width</span>
          <input type="range" id="miniStereoWidthSlider" class="mini-effect-slider" min="0" max="200" value="100" step="1">
          <span class="mini-effect-value" id="miniStereoWidthVal">100%</span>
        </div>
        <div class="mini-effect-row">
          <span class="mini-effect-label"><i class="fas fa-expand"></i> Surround</span>
          <label class="mini-effect-toggle">
            <input type="checkbox" id="miniSurroundToggle">
            <span class="mini-effect-toggle-slider"></span>
          </label>
          <span class="mini-effect-toggle-label" id="miniSurroundStatus">OFF</span>
        </div>
        <div class="mini-effect-row">
          <span class="mini-effect-label"><i class="fas fa-bolt"></i> Bass</span>
          <label class="mini-effect-toggle">
            <input type="checkbox" id="miniBassBoostToggle">
            <span class="mini-effect-toggle-slider"></span>
          </label>
          <span class="mini-effect-toggle-label" id="miniBassBoostStatus">OFF</span>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="mini-tabs">
      <button class="tab-btn active" id="tabResults" data-tab="results">
        <i class="fas fa-list-ul"></i> Buscar
      </button>
      <button class="tab-btn" id="tabPlaylist" data-tab="playlist">
        <i class="fas fa-heart"></i> Favoritos <span id="favCount" class="badge">0</span>
      </button>
    </nav>

    <!-- Content Lists -->
    <main class="content-container">
      <!-- Section Results -->
      <div id="sectionResults" class="tab-content">
        <div id="resultsList" class="radio-list">
          <!-- Dinámico -->
          <div class="list-placeholder">
            <i class="fas fa-search"></i>
            <p>Busca emisoras por nombre, género o país.</p>
          </div>
        </div>
      </div>

      <!-- Section Playlist -->
      <div id="sectionPlaylist" class="tab-content hidden">
        <div id="playlistList" class="radio-list">
          <!-- Dinámico -->
          <div class="list-placeholder">
            <i class="far fa-heart"></i>
            <p>No tienes emisoras en tus favoritos.</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Background Player Widget (Sticky Footer) -->
    <footer class="mini-player">
      <div class="player-upper">
        <div class="player-info">
          <div class="now-playing-title" id="nowPlayingTitle">Radios Mini — Sintoniza una radio</div>
          <div class="now-playing-sub" id="nowPlayingSub">Selecciona una emisora de la lista</div>
          <div class="mini-nowplaying-track hidden" id="miniNowPlayingTrack">
            <i class="fas fa-music"></i>
            <span id="miniNowPlayingText"></span>
          </div>
        </div>
        <div class="player-status-badge" id="playerStatusText">DETENIDO</div>
      </div>
      
      <div class="player-controls">
        <button class="player-btn btn-nav" id="btnMiniPrev" title="Anterior"><i class="fas fa-backward-step"></i></button>
        <button class="player-btn btn-play-pause" id="btnMiniPlay" title="Reproducir"><i class="fas fa-play"></i></button>
        <button class="player-btn btn-nav" id="btnMiniNext" title="Siguiente"><i class="fas fa-forward-step"></i></button>
        <button class="player-btn btn-mute" id="btnMiniMute" title="Silenciar"><i class="fas fa-volume-high"></i></button>
      </div>

      <div class="player-progress-bar">
        <div class="player-progress-fill" id="playerProgressFill"></div>
      </div>
    </footer>

    <!-- Audio Element -->
    <audio id="audioElement" playsinline></audio>
  </div>

  <script src="mini.js"></script>
</body>
</html>
