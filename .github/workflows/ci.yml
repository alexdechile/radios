name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m py_compile server.py scripts/security_smoke.py
          python -m compileall -q radios_app

      - name: Check JavaScript
        run: |
          node --check app.js
          node --check admin.js
          node --check sw.js
          node --check vendor/plyr/plyr.js
          node --check vendor/htmx/htmx.min.js

      - name: Python lint (pyflakes)
        run: |
          pip install pyflakes
          pyflakes server.py radios_app scripts/security_smoke.py

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Security smoke tests
        run: python scripts/security_smoke.py
