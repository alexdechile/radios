name: Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Publish APK to GitHub Release (latest-debug)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          mv "$APK_PATH" "radios-debug.apk"
          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload latest-debug radios-debug.apk --clobber
          else
            gh release create latest-debug radios-debug.apk \
              --title "Radios Android (Latest Debug)" \
              --notes "APK compilado automáticamente desde GitHub Actions." \
              --prerelease
          fi
